name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-suite:
    name: Offline test-suite (deterministic, no network)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Issue #3 acceptance requirement: the fixture/fake-wrapper suite covers
      # discovery, pagination, Issue-vs-PR filtering, allowlist enforcement,
      # auth/label failures, repeated polls, restarts, label removal/re-add,
      # pre-existing PRs and failure/retry behaviour — with no paid model calls
      # and no live GitHub mutation.
      - name: Run offline dispatch suite
        run: ./scripts/test-offline.sh

      # The Issue #1/#2 validation suite is kept as a regression gate. It also
      # runs offline in --mock mode.
      - name: Run runtime validation suite (mock)
        run: ./scripts/smoke-runtime.sh --mock
